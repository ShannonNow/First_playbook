---
- name: Quick webserver install and config
  hosts: master01
  gather_facts: false
  become: true
  tasks:
    - name: Install Apache webserver
      ansible.builtin.package:
        name: apache2
        state: present

    - name: Start and enable Apache service
      ansible.builtin.service:
        name: apache2
        state: started
        enabled: true

    - name: Create a simple index.html file
      ansible.builtin.lineinfile:
        path: /var/www/html/index.html
        line: "<html><body><h1>Welcome to Ansible Webserver!</h1></body></html>"
        create: true
        mode: '0755'
